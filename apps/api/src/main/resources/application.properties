spring.application.name=homeport-api
server.port=8080

# Database. The defaults match the local database (see the repo's README).
spring.datasource.url=${HOMEPORT_DB_URL:jdbc:postgresql://localhost:5432/homeport}
spring.datasource.username=${HOMEPORT_DB_USER:homeport}
spring.datasource.password=${HOMEPORT_DB_PASSWORD:homeport}

# The schema is owned by Flyway (db/migration). The code reads and writes it with plain SQL (the *Store classes).
spring.flyway.locations=classpath:db/migration
# On Supabase the API keeps its tables in a schema of its own (HOMEPORT_DB_SCHEMA=homeport), so Supabase's own
# data API, which serves the "public" schema to anyone with the project's public key, never sees them.
# See docs/08-connect-services.md.
spring.flyway.default-schema=${HOMEPORT_DB_SCHEMA:public}
spring.flyway.schemas=${HOMEPORT_DB_SCHEMA:public}
spring.datasource.hikari.maximum-pool-size=${HOMEPORT_DB_POOL:10}
# Every connection looks in the API's own schema first, wherever it was named (so the database address doesn't
# have to repeat it), then where Supabase keeps extensions, then the default.
spring.datasource.hikari.connection-init-sql=set search_path to "${HOMEPORT_DB_SCHEMA:public}", extensions, public

spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health

# The API's description and its try-it-out page are for the people building it: on in local mode, off everywhere else.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Behind a proxy (Fly.io), set HOMEPORT_FORWARD_HEADERS=framework so the API knows it is reached over https,
# and HOMEPORT_PUBLIC_URL to the address people use, for links that leave the app (a guest pass, a link to join a circle).
server.forward-headers-strategy=${HOMEPORT_FORWARD_HEADERS:none}
homeport.public-url=${HOMEPORT_PUBLIC_URL:}
# The header in which the proxy says where a request really came from (on Fly.io: Fly-Client-IP). Wrong
# passwords and requests without a sign-in are counted by it. Empty: the address of the connection itself.
homeport.client-address-header=${HOMEPORT_CLIENT_ADDRESS_HEADER:}

# Every log line of a request carries the request's id (see RequestId), and so does an error the app shows.
logging.pattern.correlation=[%X{request:-}] 

# When the API is asked to stop (a deploy), it finishes what it is doing first: requests, and jobs under way.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=45s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=40s

# The API's own style sheets and pictures (for the shared pages) may be kept by browsers for a day.
spring.web.resources.cache.cachecontrol.max-age=1d
spring.web.resources.cache.cachecontrol.cache-public=true

# The address shown on the contact page, and what the two files that let shared links open the app are built from.
homeport.contact.email=${HOMEPORT_CONTACT_EMAIL:}
homeport.links.ios-app-id=${HOMEPORT_IOS_APP_ID:}
homeport.links.android-package=${HOMEPORT_ANDROID_PACKAGE:}
homeport.links.android-fingerprints=${HOMEPORT_ANDROID_FINGERPRINTS:}

# How fast one person may call the API, per minute. See RateLimit.
homeport.rate-limit.enabled=true
homeport.rate-limit.reads-per-minute=600
homeport.rate-limit.writes-per-minute=120
homeport.rate-limit.sign-ins-per-minute=10

# How people sign in: 'local' (test code) or 'supabase' (connected later). See AuthProperties.
homeport.auth.mode=${HOMEPORT_AUTH_MODE:supabase}

homeport.auth.supabase.url=${SUPABASE_URL:}
# Only for an older Supabase project that signs tokens with a shared secret. Empty means: use its public keys.
homeport.auth.supabase.jwt-secret=${SUPABASE_JWT_SECRET:}
# The project's secret key. Used only to remove the sign-in when an account is deleted.
homeport.auth.supabase.service-key=${SUPABASE_SERVICE_KEY:}

# "Continue with Apple": 'apple' when the app offers it (Apple requires that deleting an account also tells
# Apple, which needs a key from the Apple Developer account), 'off' until then. See AppleSignIn.
homeport.apple.mode=${HOMEPORT_APPLE_MODE:off}
homeport.apple.team-id=${APPLE_TEAM_ID:}
homeport.apple.key-id=${APPLE_KEY_ID:}
# The app's identifier (the same as ios.bundleIdentifier in app.json).
homeport.apple.client-id=${APPLE_CLIENT_ID:}
# The contents of the .p8 key file.
homeport.apple.private-key=${APPLE_PRIVATE_KEY:}
homeport.apple.url=https://appleid.apple.com

# Where photos and clips are kept: 'local' (a folder on this computer) or 'r2' (Cloudflare R2).
homeport.media.mode=${HOMEPORT_MEDIA_MODE:r2}
homeport.media.r2.endpoint=${R2_ENDPOINT:}
homeport.media.r2.bucket=${R2_BUCKET:}
homeport.media.r2.access-key-id=${R2_ACCESS_KEY_ID:}
homeport.media.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
# The address photos are read from: the bucket's public (CDN) address, without a slash at the end.
homeport.media.r2.public-url=${R2_PUBLIC_URL:}

# Push notifications: 'expo' sends through the Expo Push Service; 'off' sends nothing; 'local' writes each push
# to the log.
# The access token is only needed if "enhanced security" is switched on for the Expo project.
homeport.push.mode=${HOMEPORT_PUSH_MODE:expo}
homeport.push.expo.access-token=${EXPO_ACCESS_TOKEN:}
homeport.push.expo.url=https://exp.host/--/api/v2/push
# Email (the Sunday summary for people who asked for it): 'resend' sends it; 'off' sends nothing; 'local' writes
# it to the log.
homeport.email.mode=${HOMEPORT_EMAIL_MODE:resend}
homeport.email.resend.api-key=${RESEND_API_KEY:}
homeport.email.resend.url=https://api.resend.com
homeport.email.from=${HOMEPORT_EMAIL_FROM:Homeport <hello@example.com>}

homeport.email.deliver-every=PT1M
homeport.email.cleanup-cron=0 55 3 * * *
# Emails go out a couple a second: email services take only so many.
homeport.email.pause=PT0.5S
homeport.media.sweep-every=PT1M
# How often reminders and events that are due are looked for and pushed.
homeport.plan.push-every=PT1M
# How much a circle may keep, in bytes, as "48 of 200 GB" shows it. There are no plans to choose from yet, so
# every circle has the same, and nothing is refused when it is passed.
homeport.library.quota-bytes=214748364800
homeport.rate-limit.cleanup-cron=0 45 3 * * *
homeport.accounts.upkeep-every=PT5M
# Set to false to run the API without any of the jobs above (the tests do).
homeport.jobs.enabled=true
spring.servlet.multipart.enabled=false

# Answers are compressed on the way out when the app says it can read that (it does): lists are mostly repeated words and shrink to about a tenth.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/html,text/css
server.compression.min-response-size=1024

# Limits on the database, so one slow question can't take the API down with it (docs/02-tech-stack.md has the
# reasons). A request waits 3 seconds for a free connection, not 30. Every connection is opened with: a
# statement is stopped after 5 seconds, a wait for a lock after 3, and a transaction left open and idle after
# 30. A background job that reads a lot raises the first limit for itself ("set local statement_timeout" in
# its own transaction), and so does a migration. The database's just-in-time compiler is switched off: it
# only pays for long reports, and here it added a second to short questions it misjudged.
spring.datasource.hikari.connection-timeout=${HOMEPORT_DB_CONNECTION_WAIT_MS:3000}
spring.datasource.hikari.data-source-properties.options=${HOMEPORT_DB_OPTIONS:-c statement_timeout=5000 -c lock_timeout=3000 -c idle_in_transaction_session_timeout=30000 -c jit=off}
