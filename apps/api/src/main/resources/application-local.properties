# Local mode: everything runs on one computer, with stand-ins for the outside services.
# Start it with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

homeport.auth.mode=local
homeport.auth.local.secret=local-development-only-not-a-real-secret-0123456789
homeport.auth.local.code=123456
homeport.auth.local.token-ttl=30d

# The stand-in tables (db/local) exist only in local mode.
spring.flyway.locations=classpath:db/migration,classpath:db/local

# The web preview runs in a browser, which needs CORS. Phones don't.
homeport.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.*.*.*:*

logging.level.app.homeport=DEBUG

# The API's description (/v3/api-docs) and try-it-out page (/swagger-ui.html).
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# One computer, one address: a tester signing in and out shouldn't hit the ceiling for sign-ins.
homeport.rate-limit.sign-ins-per-minute=120

# Photos and clips are kept in a folder and served by the API itself.
homeport.media.mode=local
homeport.media.local.dir=${HOMEPORT_MEDIA_DIR:.dev/media}
homeport.media.local.secret=${homeport.auth.local.secret}

# The people of the screens (The Linds and the other circles), added once when the database is empty.
homeport.seed.enabled=true

# Pushes and emails are written to this log instead of being sent. Pushes go out quickly, so you see them while testing.
homeport.push.mode=local
homeport.email.mode=local

# Where the sample photos are (the screens' own), seen from apps/api.
homeport.seed.images=${HOMEPORT_SEED_IMAGES:../../design/hub/img}
