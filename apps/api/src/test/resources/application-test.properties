# Tests run against a real PostgreSQL, in their own database.
spring.datasource.url=${HOMEPORT_TEST_DB_URL:jdbc:postgresql://localhost:5432/homeport_test}
logging.level.app.homeport=INFO
homeport.media.local.dir=${java.io.tmpdir}/homeport-test-media
homeport.seed.enabled=false
# The tests call the API far faster than a person; the ceilings have a test of their own.
homeport.rate-limit.enabled=false
# No job runs by itself in a test: each test calls the job's work when it wants it done.
homeport.jobs.enabled=false
# Several test contexts are kept open at once, each with its own pool: keep them small, and let go of
# connections nobody is using.
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
# Emails go out without the pause between them that the real email service needs.
homeport.email.pause=PT0S
